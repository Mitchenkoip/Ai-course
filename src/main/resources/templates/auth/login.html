<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"><style>body{background:WhiteSmoke}.login-form{width:300px;margin:8rem auto}</style></head>
<body><main class="login-form"><h1 class="h3 mb-3">Please sign in</h1>
  <div class="text-danger mb-3" th:if="${param.error}">Неправильные имя или пароль</div>
  <form method="post" action="/process_login"><div class="form-floating mb-3"><input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required><label for="email">Email address</label></div>
  <div class="form-floating mb-3"><input class="form-control" id="password" name="password" type="password" placeholder="Password" required><label for="password">Password</label></div><button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button></form>
</main></body></html>
