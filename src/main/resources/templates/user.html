<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css?v=2">
</head>
<body>
<header th:replace="~{fragments/layout :: pageHeader(${authUser})}"></header>

<div class="layout">
    <nav class="sidebar nav nav-pills flex-column">
        <a class="nav-link active" href="/user">User</a>
    </nav>
    <main class="flex-grow-1">
        <h1>User information-page</h1>
        <div class="card user-card">
            <div class="card-header"><h2>About user</h2></div>
            <div class="card-body table-responsive">
                <section th:replace="~{fragments/layout :: userTable(${authUser})}"></section>
            </div>
        </div>
    </main>
</div>
</body>
</html>
