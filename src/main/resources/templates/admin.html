<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css?v=2">
</head>
<body>
<header th:replace="~{fragments/layout :: pageHeader(${authUser})}"></header>

<div class="layout">
    <nav class="sidebar nav nav-pills flex-column" data-tab-list>
        <a class="nav-link active" href="#admin" data-tab-target="admin">Admin</a>
        <a class="nav-link" href="#current-user" data-tab-target="current-user">User</a>
    </nav>

    <main class="flex-grow-1 tab-content">
        <section class="tab-pane active" id="admin">
            <h1>Admin panel</h1>
            <ul class="nav nav-tabs" data-tab-list>
                <li class="nav-item">
                    <a class="nav-link active" href="#users-table" data-tab-target="users-table">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#add-user" data-tab-target="add-user">Add user</a>
                </li>
            </ul>

            <div class="tab-content bg-white p-3 admin-content">
                <div class="tab-pane active" id="users-table">
                    <div class="card">
                        <div class="card-header"><h2>All users</h2></div>
                        <div class="card-body table-responsive">
                    <table class="table table-hover" id="usersTable">
                        <thead>
                        <tr>
                            <th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th>
                            <th>Email</th><th>Role</th><th>Edit</th><th>Delete</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                        </div>
                    </div>
                </div>

                <div class="tab-pane" id="add-user">
                    <div class="card">
                        <div class="card-header"><h2>Add new user</h2></div>
                        <div class="card-body">
                    <form id="createForm" class="add-form" novalidate>
                        <div class="alert alert-danger d-none" id="createError" role="alert"></div>
                        <div class="form-group"><label for="firstName">First name</label><input class="form-control" id="firstName" name="firstName" minlength="2" maxlength="30" required></div>
                        <div class="form-group"><label for="lastName">Last name</label><input class="form-control" id="lastName" name="lastName" minlength="2" maxlength="30" required></div>
                        <div class="form-group"><label for="age">Age</label><input class="form-control" id="age" name="age" type="number" min="18" max="150" required></div>
                        <div class="form-group"><label for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="100" required></div>
                        <div class="form-group"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
                        <div class="form-group"><label for="createRoles">Role</label>
                            <select class="form-control role-select" id="createRoles" name="roles" multiple required>
                                <option value="ROLE_USER">USER</option>
                                <option value="ROLE_ADMIN">ADMIN</option>
                            </select>
                        </div>
                        <button class="btn btn-success btn-lg mt-2" type="submit">Add new user</button>
                    </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="tab-pane" id="current-user">
            <h1>User information-page</h1>
            <div class="card user-card">
                <div class="card-header"><h2>About user</h2></div>
                <div class="card-body table-responsive">
                    <section th:replace="~{fragments/layout :: userTable(${authUser})}"></section>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="editForm">
                <div class="modal-header">
                    <h5>Edit user</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body" id="editFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="deleteForm">
                <div class="modal-header">
                    <h5>Delete user</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body" id="deleteFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button class="btn btn-primary">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
<script src="/static/js/main.js?v=5"></script>
</body>
</html>
